<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARSCREAM — AUTH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05020a;
      color: #cc88ff;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .status { font-size: 18px; letter-spacing: 3px; color: #00d5ff; }
    .sub { font-size: 12px; color: #cc88ff; letter-spacing: 2px; opacity: 0.7; }
    .bar { width: 280px; height: 4px; background: rgba(200,120,255,0.15); border-radius: 2px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: #cc88ff; transition: width 0.3s ease; }
    .error { color: #ff4444; font-size: 13px; letter-spacing: 1px; max-width: 340px; text-align: center; }
  </style>
</head>
<body>

  <div class="status" id="statusMsg">AUTHENTICATING...</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="sub" id="subMsg">EXCHANGING TOKEN WITH SPOTIFY</div>
  <div class="error" id="errorMsg" style="display:none;"></div>

  <script>
    const CLIENT_ID    = "dd95f1b1bfb243fd9ce7befe84b22385";
    const REDIRECT_URI = "https://decepticons.tech/callback.html";

    const statusEl = document.getElementById("statusMsg");
    const subEl    = document.getElementById("subMsg");
    const fillEl   = document.getElementById("fill");
    const errorEl  = document.getElementById("errorMsg");

    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get("code");
      const error  = params.get("error");

      if (error) {
        statusEl.innerText = "AUTH DENIED";
        errorEl.style.display = "block";
        errorEl.innerText = "Spotify returned: " + error;
        return;
      }

      if (!code) {
        statusEl.innerText = "NO CODE";
        errorEl.style.display = "block";
        errorEl.innerText = "Missing authorization code in URL.";
        return;
      }

      const verifier = localStorage.getItem("spotify_code_verifier");
      if (!verifier) {
        statusEl.innerText = "NO VERIFIER";
        errorEl.style.display = "block";
        errorEl.innerText = "PKCE verifier missing from localStorage.";
        return;
      }

      fillEl.style.width = "40%";
      subEl.innerText = "CONTACTING SPOTIFY API";

      try {
        const res = await fetch("https://accounts.spotify.com/api/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            grant_type:    "authorization_code",
            code:          code,
            redirect_uri:  REDIRECT_URI,
            client_id:     CLIENT_ID,
            code_verifier: verifier
          })
        });

        const data = await res.json();

        if (data.error) {
          statusEl.innerText = "TOKEN ERROR";
          errorEl.style.display = "block";
          errorEl.innerText = data.error + ": " + (data.error_description || "");
          return;
        }

        fillEl.style.width = "80%";
        subEl.innerText = "SAVING TOKEN...";

        localStorage.setItem("spotify_token", data.access_token);
        if (data.refresh_token) localStorage.setItem("spotify_refresh_token", data.refresh_token);
        localStorage.removeItem("spotify_code_verifier");

        fillEl.style.width = "100%";
        statusEl.innerText = "AUTHENTICATED ✓";
        subEl.innerText = "RETURNING TO STARSCREAM HUD...";

        setTimeout(() => {
          window.location.href = "https://decepticons.tech/";
        }, 1000);

      } catch(err) {
        statusEl.innerText = "NETWORK ERROR";
        errorEl.style.display = "block";
        errorEl.innerText = err.message;
      }
    }

    handleCallback();
  </script>

</body>
</html>
